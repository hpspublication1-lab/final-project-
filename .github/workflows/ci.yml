name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'recovery/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'recovery/**'

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Quality Gate
        run: npm run type-check

      - name: Unit Tests
        run: npm test
