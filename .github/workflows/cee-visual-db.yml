name: CEE visual — database checks

# Runs only on changes that can affect the CEE visual schema or the code that
# talks to it. Uses a throwaway Postgres service; never touches a real project.
on:
  pull_request:
    paths:
      - 'supabase/proposed/**'
      - 'scripts/cee/**'
      - 'src/lib/cee-visual/**'
      - 'src/app/api/v1/cee/**'
      - '.github/workflows/cee-visual-db.yml'
  push:
    branches:
      - 'feat/cee-visual-**'

permissions:
  contents: read

jobs:
  schema-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      PG: psql -h 127.0.0.1 -p 5432 -U postgres
      PGPORT_TCP: '5432'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Schema checks (102 SQL assertions), rollback and its publication guard
        run: |
          $PG -q -d postgres -c "CREATE DATABASE cee_sql"
          $PG -q -d cee_sql -v ON_ERROR_STOP=1 -f scripts/cee/staging/tests/supabase_base.sql
          $PG -q -d cee_sql -v ON_ERROR_STOP=1 -f supabase/proposed/20261124_cee_visual_foundation.sql
          { echo 'BEGIN;'; cat supabase/proposed/tests/cee_visual_foundation_test.sql; echo 'ROLLBACK;'; } | $PG -q -d cee_sql | tee sql-tests.txt
          if grep -qE '\| FAIL +\|' sql-tests.txt; then echo "::error::SQL assertions failed"; exit 1; fi
          test "$(grep -cE '\| PASS +\|' sql-tests.txt)" -ge 102
          $PG -q -d cee_sql -v ON_ERROR_STOP=1 -f supabase/proposed/20261124_cee_visual_foundation_ROLLBACK.sql
          left=$($PG -d cee_sql -At -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'cee\_%'")
          test "$left" = "0" || { echo "::error::rollback left $left tables"; exit 1; }
          # Once lessons are published, the rollback must refuse rather than drop them.
          $PG -q -d cee_sql -v ON_ERROR_STOP=1 -f supabase/proposed/20261124_cee_visual_foundation.sql
          $PG -q -d cee_sql -f supabase/proposed/tests/cee_visual_foundation_test.sql > /dev/null
          if $PG -q -d cee_sql -v ON_ERROR_STOP=1 -f supabase/proposed/20261124_cee_visual_foundation_ROLLBACK.sql 2> guard.txt; then
            echo "::error::rollback dropped published lessons"; exit 1; fi
          grep -q 'Refusing: lessons have been published' guard.txt

      - name: Superseded-schema detection and removal
        run: |
          $PG -q -d postgres -c "CREATE DATABASE cee_sup"
          $PG -q -d cee_sup -v ON_ERROR_STOP=1 -f scripts/cee/staging/tests/supabase_base.sql
          $PG -q -d cee_sup -v ON_ERROR_STOP=1 -f scripts/cee/staging/tests/repo_profiles.sql
          $PG -q -d cee_sup -1 -v ON_ERROR_STOP=1 -f supabase/superseded/20261124000000_cee_visual_intelligence_core.sql
          # The second superseded file cannot apply to this schema (user_profiles has no user_id
          # column; user_role has no super_admin). It must fail and leave nothing behind.
          if $PG -q -d cee_sup -1 -v ON_ERROR_STOP=1 -f supabase/superseded/20261124000001_cee_audit_and_reviews.sql; then
            echo "::error::superseded 000001 unexpectedly applied"; exit 1; fi
          $PG -d cee_sup -At -F'|' -f scripts/cee/staging/check_superseded.sql | grep '^VERDICT|SUPERSEDED'
          $PG -q -d cee_sup -v ON_ERROR_STOP=1 -f scripts/cee/staging/remove_superseded.sql
          $PG -d cee_sup -At -F'|' -f scripts/cee/staging/check_superseded.sql | grep '^VERDICT|CLEAN'
          $PG -q -d cee_sup -v ON_ERROR_STOP=1 -f supabase/proposed/20261124_cee_visual_foundation.sql
          $PG -d cee_sup -At -F'|' -f scripts/cee/staging/check_superseded.sql | grep '^VERDICT|CHOSEN SCHEMA INSTALLED'

      - name: Schema-only snapshot round trip
        run: scripts/cee/staging/tests/snapshot_roundtrip.sh

      - name: Staging validation runner (against a schema-only copy)
        run: |
          $PG -q -d postgres -c "CREATE DATABASE cee_stg"
          $PG -q -d cee_stg -v ON_ERROR_STOP=1 -f scripts/cee/staging/tests/supabase_base.sql
          STAGING_DB_URL="postgresql://postgres:ci-only-password@127.0.0.1:5432/cee_stg" CEE_STAGING_CONFIRM=staging \
            LOG_DIR=ci-evidence scripts/cee/staging/validate_migration.sh

      - name: PostgREST v12.0.2
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.0.2/postgrest-v12.0.2-linux-static-x64.tar.xz
          tar -xJf /tmp/postgrest.tar.xz -C /tmp && /tmp/postgrest --version

      - name: API integration tests (real PostgREST)
        env:
          POSTGREST_BIN: /tmp/postgrest
        run: |
          scripts/cee/it-setup.sh | tee it-env.txt
          eval "$(grep '^export ' it-env.txt)"
          npx vitest run --no-file-parallelism src/lib/cee-visual/__tests__/api.integration.test.ts 2>&1 | tee it-api.log
          scripts/cee/it-setup.sh > /dev/null
          npx vitest run --no-file-parallelism src/lib/cee-visual/__tests__/admin.integration.test.ts 2>&1 | tee it-admin.log
          scripts/cee/it-setup.sh > /dev/null
          npx vitest run --no-file-parallelism src/lib/cee-visual/__tests__/assets.integration.test.ts 2>&1 | tee it-assets.log

      # Logs as annotations, so a failure can be read from the checks page without downloading anything.
      - name: Service logs on failure
        if: failure()
        run: |
          note() { [ -s "$2" ] && echo "::error title=$1::$(tail -c 3000 "$2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')" || true; }
          note postgrest.log /tmp/cee-it/postgrest.log
          note proxy.log /tmp/cee-it/proxy.log
          grep -h '\[cee-visual\]' it-api.log it-admin.log it-assets.log 2>/dev/null | head -20 > app-errors.txt || true
          note app-errors app-errors.txt
          node --version

      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cee-visual-db-evidence
          path: |
            sql-tests.txt
            it-api.log
            it-admin.log
            it-assets.log
            ci-evidence/
            /tmp/cee-snapshot/
          if-no-files-found: ignore
