# ==============================================================================
# SAMYAK MULTIPLAYER — NGINX REVERSE PROXY & WEBSOCKET CONFIGURATION
# File location: /etc/nginx/sites-available/arena-ws.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/arena-ws.conf /etc/nginx/sites-enabled/
# ==============================================================================

upstream colyseus_backend {
    ip_hash; # Ensures reconnection affinity for transient mobile network handoffs
    server 127.0.0.1:2567 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arena-ws.samyakcee.com;
    return 301 https://$host$request_uri;
}

# Production WSS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arena-ws.samyakcee.com;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/arena-ws.samyakcee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena-ws.samyakcee.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Health Check Endpoint
    location /health {
        proxy_pass http://colyseus_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Real-Time WebSocket Upgrades
    location / {
        proxy_pass http://colyseus_backend;
        proxy_http_version 1.1;

        # Mandatory WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Identity & Edge IP headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket timeouts (keep connection alive during idle quiz thinking phases)
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
